name: Build and Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_SERVER_URL_API: ${{ secrets.VITE_SERVER_URL_API }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      # 임시 디버그 스텝
      - name: Debug SSH key
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IP: ${{ secrets.INSTANCE_IP }}
        run: |
          printf '%s\n' "$KEY" > /tmp/key
          chmod 600 /tmp/key
          echo "=== 줄 수 (정상 ed25519면 6~8줄, 1이면 줄바꿈 깨짐) ==="
          wc -l < /tmp/key
          echo "=== 키 지문 (parsing 테스트) ==="
          ssh-keygen -l -f /tmp/key || echo "키 파싱 실패 - secret 값이 깨짐"
          echo "=== IP 글자수 (값은 마스킹, 168.107.41.93 이면 12) ==="
          printf '%s' "$IP" | wc -c

      - name: Deploy to Instance
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/tmp/deploy"
          strip_components: 1

      - name: Update Frontend Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "=== Deploying to frontend container ==="
            docker exec frontend sh -c "rm -rf /usr/share/nginx/html/*"
            docker cp /tmp/deploy/. frontend:/usr/share/nginx/html/
            docker exec frontend nginx -s reload
            rm -rf /tmp/deploy
            echo "✓ Deployment complete!"